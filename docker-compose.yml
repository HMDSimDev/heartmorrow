services:
  heartmorrow:
    build: .
    image: heartmorrow:latest

    # The app has NO authentication, so it is advised to not publish it to your LAN.
    # Change to "8787:8787" ONLY if you fully trust the network in front of it.
    ports:
      - "127.0.0.1:8787:8787"

    # Persist the SQLite DB + uploaded assets across container rebuilds
    volumes:
      - heartmorrow-data:/data

    environment:
      HOST: 0.0.0.0
      # you can also set this up in the Heartmorrow settings, for more control
      LLM_BASE_URL: http://host.docker.internal:1234/v1
      # LLM_API_KEY: lm-studio
      # LLM_MODEL: local-model

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  heartmorrow-data:
